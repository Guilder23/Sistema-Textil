services:
  - type: web
    name: sistema-textil
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn sistema_textil.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DJANGO_SETTINGS_MODULE
        value: sistema_textil.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-textil-db
          property: connectionString
      - key: RENDER
        value: "true"
    disk:
      name: media-files
      mountPath: /opt/render/project/src/media
      sizeGB: 1

# Cron job para backup automático de archivos media
crons:
  - name: backup-media-files
    schedule: "0 */6 * * *"  # Cada 6 horas
    command: "python scheduled_backup.py"
    service: sistema-textil
