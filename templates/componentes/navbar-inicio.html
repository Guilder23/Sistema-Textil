{% load static %}

{% if not user.is_authenticated %}
<nav class="navbar-inicio navbar navbar-expand-lg">
    <div class="container-fluid navbar-inicio-container">
        <!-- Left: Toggle and Logo -->
        <div class="navbar-left">
            <button class="mobile-nav-toggle d-lg-none" id="mobileNavToggle" aria-label="Menú">
                <i class="fas fa-bars"></i>
            </button>
            <a class="navbar-brand-inicio" href="{% url 'core:inicio' %}">
                <img src="{% static 'img/logoAlmacen.png' %}" alt="Logo" class="navbar-logo">
                <span class="navbar-brand-text">
                    <span class="brand-american">AMERICAN</span> <span class="brand-outlet">OUTLET</span>
                </span>
            </a>
        </div>

        <!-- Middle: Search and Nav Links -->
        <div class="navbar-center">
            <ul class="navbar-desktop-links d-none d-lg-flex">
                <li><a class="nav-link" href="{% url 'core:inicio' %}">Inicio</a></li>
                <li><a class="nav-link" href="#catalogo">Catálogo</a></li>
                <li><a class="nav-link" href="#proceso">¿Cómo trabajamos?</a></li>
                <li><a class="nav-link" href="#faq">FAQ</a></li>
                <li><a class="nav-link" href="#contacto">Contacto</a></li>
            </ul>
            <!-- Search Form - both desktop and mobile in center -->
            <form id="navSearchFormInline" method="get" action="{% url 'core:inicio' %}" class="nav-search-form-inline">
                <input id="navSearchInputInline" name="q" type="search" class="nav-search-input" placeholder="Buscar producto..." value="{{ q }}">
            </form>
        </div>

        <!-- Right: Icons -->
        <div class="navbar-right-icons">
            <div class="dropdown d-none d-lg-block">
                <button id="navFilterBtn" class="nav-icon-btn" type="button" aria-label="Filtros" title="Filtros">
                    <i class="fas fa-filter"></i>
                </button>
                <div class="dropdown-menu dropdown-menu-right nav-filter-dropdown" id="navFilterDropdown" aria-labelledby="navFilterBtn">
                    <form method="get" action="{% url 'core:inicio' %}" class="px-3 py-2" id="navFilterForm">
                        <input type="hidden" name="q" value="{{ q }}">
                        
                        <div class="form-group mb-2">
                            <label class="mb-1" for="navFilterCategoria">Categoría</label>
                            <select class="form-control form-control-sm" name="categoria" id="navFilterCategoria">
                                <option value="">Todas</option>
                                {% for c in categorias %}
                                <option value="{{ c.id }}" {% if categoria_id == c.id|stringformat:'s' %}selected{% endif %}>{{ c.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group col-6 mb-2">
                                <label class="mb-1" for="navFilterPrecioMin">Precio mín.</label>
                                <input type="text" class="form-control form-control-sm" id="navFilterPrecioMin" name="precio_min" value="{{ precio_min }}" inputmode="decimal" placeholder="0">
                            </div>
                            <div class="form-group col-6 mb-2">
                                <label class="mb-1" for="navFilterPrecioMax">Precio máx.</label>
                                <input type="text" class="form-control form-control-sm" id="navFilterPrecioMax" name="precio_max" value="{{ precio_max }}" inputmode="decimal" placeholder="—">
                            </div>
                        </div>
                        
                        <div class="form-group mb-2">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="navFilterOferta" name="oferta" value="1" {% if oferta == '1' %}checked{% endif %}>
                                <label class="custom-control-label" for="navFilterOferta">Solo ofertas</label>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{% url 'core:inicio' %}" class="btn btn-sm btn-outline-secondary">Limpiar</a>
                            <button type="submit" class="btn btn-sm btn-primary">Aplicar</button>
                        </div>
                    </form>
                </div>
            </div>
            <a href="{% url 'core:ver_carrito' %}" class="nav-icon-btn" title="Ver Carrito" aria-label="Carrito">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-counter" class="cart-counter-badge">0</span>
            </a>
            <a href="{% url 'core:login' %}" class="nav-icon-btn" aria-label="Iniciar sesión" title="Iniciar sesión">
                <i class="fas fa-user"></i>
            </a>
        </div>
    </div>
</nav>

<!-- Mobile Navbar Overlay -->
<div class="mobile-nav-overlay d-lg-none" id="mobileNavOverlay"></div>

<!-- Mobile Navbar -->
<div class="mobile-nav d-lg-none" id="mobileNav">
    <div class="mobile-nav-header">
        <a class="navbar-brand-inicio" href="{% url 'core:inicio' %}">
            <img src="{% static 'img/logoAlmacen.png' %}" alt="Logo" class="navbar-logo">
            <span class="navbar-brand-text">
                <span class="brand-american">AMERICAN</span> <span class="brand-outlet">OUTLET</span>
            </span>
        </a>
        <button class="mobile-nav-close" id="mobileNavClose" aria-label="Cerrar">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <ul class="mobile-nav-links">
        <li><a class="nav-link" href="{% url 'core:inicio' %}">Inicio</a></li>
        <li><a class="nav-link" href="#catalogo">Catálogo</a></li>
        <li><a class="nav-link" href="#proceso">Cómo trabajamos</a></li>
        <li><a class="nav-link" href="#faq">FAQ</a></li>
        <li><a class="nav-link" href="#contacto">Contacto</a></li>
    </ul>
    <div class="mobile-nav-filters">
        <h4 class="mb-3">Filtros</h4>
        <form method="get" action="{% url 'core:inicio' %}">
            <input type="hidden" name="q" value="{{ q }}">
            
            <div class="form-group mb-2">
                <label class="mb-1" for="navFilterCategoriaMobile">Categoría</label>
                <select class="form-control form-control-sm" name="categoria" id="navFilterCategoriaMobile">
                    <option value="">Todas</option>
                    {% for c in categorias %}
                    <option value="{{ c.id }}" {% if categoria_id == c.id|stringformat:'s' %}selected{% endif %}>{{ c.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group mb-2">
                <label class="mb-1" for="navFilterPrecioMinMobile">Precio mín.</label>
                <input type="text" class="form-control form-control-sm" id="navFilterPrecioMinMobile" name="precio_min" value="{{ precio_min }}" inputmode="decimal" placeholder="0">
            </div>
            <div class="form-group mb-2">
                <label class="mb-1" for="navFilterPrecioMaxMobile">Precio máx.</label>
                <input type="text" class="form-control form-control-sm" id="navFilterPrecioMaxMobile" name="precio_max" value="{{ precio_max }}" inputmode="decimal" placeholder="—">
            </div>
            
            <div class="form-group mb-3">
                <div class="custom-control custom-checkbox">
                    <input type="checkbox" class="custom-control-input" id="navFilterOfertaMobile" name="oferta" value="1" {% if oferta == '1' %}checked{% endif %}>
                    <label class="custom-control-label" for="navFilterOfertaMobile">Solo ofertas</label>
                </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center">
                <a href="{% url 'core:inicio' %}" class="btn btn-sm btn-outline-secondary">Limpiar</a>
                <button type="submit" class="btn btn-sm btn-primary">Aplicar</button>
            </div>
        </form>
    </div>
</div>
{% endif %}
