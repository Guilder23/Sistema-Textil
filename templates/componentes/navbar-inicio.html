{% load static %}

{% if not user.is_authenticated %}
<nav class="navbar-inicio navbar-expand-lg">
    <div class="container-fluid navbar-inicio-container">
        <a class="navbar-brand-inicio" href="{% url 'core:inicio' %}">
            <div class="navbar-logo-wrapper">
                <img src="{% static 'img/logoAlmacen.png' %}" alt="Logo Almacen" style="height:32px;max-width:140px;object-fit:contain;vertical-align:middle;">
                <span class="navbar-brand-text" style="font-size:1.05rem;vertical-align:middle;"><span class="brand-primary">American</span> <span class="brand-secondary">Outlet</span></span>
            </div>
        </a>
        <button class="navbar-toggler-inicio" type="button" aria-controls="navbarInicio" aria-expanded="false" aria-label="Menú">
            <i class="fas fa-bars"></i>
        </button>
        <div class="navbar-collapse-inicio" id="navbarInicio">
            <div class="navbar-collapse-header-inicio d-lg-none">
                <span class="navbar-brand-text"><span class="brand-primary">American</span> <span class="brand-secondary">Outlet</span></span>
                <button class="navbar-close-inicio" type="button" aria-label="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <ul class="navbar-nav navbar-links-inicio">
                <li class="nav-item"><a class="nav-link" href="#catalogo">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" href="#servicios">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" href="#proceso">Proceso</a></li>
                <li class="nav-item"><a class="nav-link" href="#faq">FAQ</a></li>
                <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
            </ul>
            <div class="d-flex align-items-center ml-lg-auto">
                <a href="{% url 'core:ver_carrito' %}" class="nav-link position-relative mr-3" title="Ver Carrito">
                    <i class="fas fa-shopping-cart" style="font-size: 1.1rem; color: #475569;"></i>
                    <span id="cart-counter" class="position-absolute badge badge-pill badge-danger" 
                          style="top: -5px; right: -5px; font-size: 0.65rem; display: none; width: 18px; height: 18px; align-items: center; justify-content: center;">0</span>
                </a>
                <a href="{% url 'core:login' %}" class="btn-inicio-login">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Iniciar sesión</span>
                </a>
            </div>
        </div>
    </div>
</nav>
