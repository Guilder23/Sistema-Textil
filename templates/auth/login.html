{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion</title>
    <link rel="icon" href="{% static 'img/logoAlmacen.png' %}" type="image/png">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/auth/login.css' %}">
</head>
<body class="login-body">
    <div class="login-bg" aria-hidden="true"></div>
    <div class="login-bg-overlay" aria-hidden="true"></div>

    <nav class="navbar navbar-login">
        <a class="navbar-brand" href="{% url 'core:inicio' %}"><i class="fas fa-layer-group"></i> TEXMODA</a>
        <a href="{% url 'core:inicio' %}" class="btn btn-outline-light btn-sm btn-nav-catalogo">Volver al catalogo</a>
    </nav>

    <div class="login-shell">
        <div class="login-wrapper">
            <div class="login-card">
                <div class="login-card-header">
                    <div class="login-card-visual">
                        <img src="{% static 'img/landing/hero-tejidos.svg' %}" alt="" class="login-card-illus">
                    </div>
                    <img class="login-logo" src="{% static 'img/logoAlmacen.png' %}" alt="" width="48" height="48" onerror="this.style.display='none'">
                    <h2>Acceso al sistema</h2>
                    <p class="login-lead">Inventario y catalogo — ingresa con tu usuario</p>
                </div>
                <form method="post" autocomplete="on">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="id_username">Usuario</label>
                        <input type="text" name="username" id="id_username" class="form-control" autocomplete="username" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="id_password">Contrasena</label>
                        <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
                    </div>
                    {% if messages %}
                        {% for message in messages %}
                        <div class="alert alert-danger py-2 mb-2">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="{% static 'js/auth/login.js' %}"></script>
</body>
</html>
