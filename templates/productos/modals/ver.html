<div class="modal fade" id="modalVerProducto" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-producto-dialog" role="document">
        <div class="modal-content modal-ver-productos">
            <div class="modal-header">
                <h5 class="modal-title">Ver Producto</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-5">
                        <div class="preview-box">
                            <div id="verImagenCarousel" class="carousel slide" data-ride="carousel" style="display:none;">
                                <ol class="carousel-indicators" id="verCarouselIndicators"></ol>
                                <div class="carousel-inner" id="verCarouselInner"></div>
                                <a class="carousel-control-prev" href="#verImagenCarousel" role="button" data-slide="prev">
                                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                    <span class="sr-only">Anterior</span>
                                </a>
                                <a class="carousel-control-next" href="#verImagenCarousel" role="button" data-slide="next">
                                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                    <span class="sr-only">Siguiente</span>
                                </a>
                            </div>
                            <span id="verImagenSinDato" class="text-muted">Sin imagen</span>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <ul class="list-group">
                            <li class="list-group-item"><strong>Nombre:</strong> <span id="verNombre"></span></li>
                            <li class="list-group-item"><strong>Codigo:</strong> <span id="verCodigo"></span></li>
                            <li class="list-group-item"><strong>Sexo:</strong> <span id="verSexo"></span></li>
                            <li class="list-group-item"><strong>Detalle:</strong> <span id="verDetalle"></span></li>
                            <li class="list-group-item"><strong>Categoria:</strong> <span id="verCategoria"></span></li>
                            <li class="list-group-item"><strong>Stock:</strong> <span id="verStock"></span></li>
                            <li class="list-group-item"><strong>Tallas:</strong> <span id="verTallas"></span></li>
                            <li class="list-group-item"><strong>Colores:</strong> <span id="verColores"></span></li>
                            <li class="list-group-item"><strong>Precio Normal (Bs):</strong> <span id="verPrecioUnidadBs"></span></li>
                            <li class="list-group-item"><strong>Precio Oferta (Bs):</strong> <span id="verPrecioOferta"></span></li>
                            <li class="list-group-item"><strong>Descuento:</strong> <span id="verDescuento"></span></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
