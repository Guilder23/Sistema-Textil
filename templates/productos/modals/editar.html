<div class="modal fade" id="modalEditarProducto" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-producto-dialog" role="document">
        <div class="modal-content modal-editar-productos">
            <form method="post" id="formEditarProducto" action="#" enctype="multipart/form-data">
                {% csrf_token %}
            <div class="modal-header">
                <h5 class="modal-title">Editar Producto</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-7">
                        <div class="form-row">
                            <div class="col-md-6 form-group">
                                <label>Codigo</label>
                                <input type="text" name="codigo" id="editCodigo" class="form-control" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Nombre</label>
                                <input type="text" name="nombre" id="editNombre" class="form-control" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Detalle</label>
                            <textarea name="detalle" id="editDetalle" class="form-control" rows="4" required></textarea>
                        </div>

                        <div class="form-row">
                            <div class="col-md-6 form-group">
                                <label>Categoria</label>
                                <select name="categoria_id" id="editCategoria" class="form-control" required>
                                    {% for c in categorias %}
                                    <option value="{{ c.id }}">{{ c.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Sexo</label>
                                <select name="sexo" id="editSexo" class="form-control" required>
                                    <option value="UNISEX">Unisex</option>
                                    <option value="MUJER">Mujer</option>
                                    <option value="HOMBRE">Hombre</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="col-md-6 form-group">
                                <label>Stock unidad</label>
                                <input type="number" name="stock_unidad" id="editStock" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Unidades/caja</label>
                                <input type="number" name="unidades_por_caja" id="editUnidades" class="form-control" min="1" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="col-md-6 form-group">
                                <label>Precio normal (Bs)</label>
                                <input type="number" step="any" name="precio_usd" id="editPrecioUsd" class="form-control" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Precio oferta (Bs - opcional)</label>
                                <input type="number" step="any" name="precio_oferta" id="editPrecioOferta" class="form-control">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="col-md-6 form-group">
                                <label>Valor Descuento</label>
                                <input type="number" step="any" name="descuento_valor" id="editDescuentoValor" class="form-control">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Tipo Descuento</label>
                                <select name="descuento_tipo" id="editDescuentoTipo" class="form-control">
                                    <option value="PORCENTAJE">% (Porcentaje)</option>
                                    <option value="MONTO">Bs (Monto fijo)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="col-md-6 form-group">
                                <label>Tallas (Ej: S, M, L)</label>
                                <input type="text" name="tallas" id="editTallas" class="form-control" placeholder="S, M, L, XL">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Colores (Ej: Rojo, Azul)</label>
                                <input type="text" name="colores" id="editColores" class="form-control" placeholder="Negro, Blanco, Rojo">
                            </div>
                        </div>

                        <div class="form-check mt-2">
                            <input type="checkbox" class="form-check-input" id="editActivo" name="activo">
                            <label class="form-check-label" for="editActivo">Activo</label>
                        </div>
                        <div class="form-check mt-2">
                            <input type="checkbox" class="form-check-input" id="editPublicado" name="publicado">
                            <label class="form-check-label" for="editPublicado">Publicado</label>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <div class="form-group">
                            <label>Imágenes</label>
                            <div class="d-flex align-items-center mb-2">
                                <button type="button" class="btn btn-outline-primary btn-sm" id="btnAgregarImagenesEditar">
                                    <i class="fas fa-plus-circle"></i> Agregar imagen
                                </button>
                                <small class="form-text text-muted ml-3">Agrega imágenes una por una y elimina las que no quieras.</small>
                            </div>
                            <input type="file" name="imagenes" id="editImagen" class="d-none" accept="image/*" multiple>
                        </div>

                        <div class="preview-box">
                            <div id="editExistingImages" class="d-flex flex-wrap mb-3"></div>
                            <div id="editImagenesPreview" class="d-flex flex-wrap mb-3"></div>
                            <span id="editImagenSinDato" class="text-muted">No hay imágenes seleccionadas.</span>
                        </div>
                        <input type="hidden" name="imagenes_eliminar" id="imagenesEliminar">
                        <input type="hidden" name="imagen_principal" id="imagenPrincipal" value="">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
            </form>
        </div>
    </div>
</div>
