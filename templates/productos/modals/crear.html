<div class="modal fade" id="modalCrearProducto" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-producto-dialog" role="document">
        <div class="modal-content modal-crear-productos">
            <form method="post" action="{% url 'productos:crear_producto' %}" enctype="multipart/form-data">
                {% csrf_token %}
            <div class="modal-header">
                <h5 class="modal-title">Crear Producto</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-7">
                        <div class="form-row">
                            <div class="col-md-6 form-group">
                                <label>Codigo</label>
                                <input type="text" name="codigo" class="form-control" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Nombre</label>
                                <input type="text" name="nombre" class="form-control" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Detalle</label>
                            <input type="text" name="detalle" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Categoria</label>
                            <select name="categoria_id" class="form-control" required>
                                {% for c in categorias %}
                                <option value="{{ c.id }}">{{ c.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Sexo</label>
                            <select name="sexo" class="form-control" required>
                                <option value="UNISEX">Unisex</option>
                                <option value="MUJER">Mujer</option>
                                <option value="HOMBRE">Hombre</option>
                            </select>
                        </div>

                        <div class="form-row">
                            <div class="col-md-6 form-group">
                                <label>Stock unidad</label>
                                <input type="number" name="stock_unidad" class="form-control" min="0" value="0" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Unidades/caja</label>
                                <input type="number" name="unidades_por_caja" class="form-control" min="1" value="1" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="col-md-6 form-group">
                                <label>Precio normal (Bs)</label>
                                <input type="number" step="0.01" name="precio_usd" class="form-control" value="0" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Precio oferta (Bs - opcional)</label>
                                <input type="number" step="0.01" name="precio_oferta" class="form-control" value="0">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="col-md-6 form-group">
                                <label>Valor Descuento</label>
                                <input type="number" step="0.01" name="descuento_valor" class="form-control" value="0">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Tipo Descuento</label>
                                <select name="descuento_tipo" class="form-control">
                                    <option value="PORCENTAJE">% (Porcentaje)</option>
                                    <option value="MONTO">Bs (Monto fijo)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="col-md-6 form-group">
                                <label>Tallas (Ej: S, M, L)</label>
                                <input type="text" name="tallas" class="form-control" placeholder="S, M, L, XL">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Colores (Ej: Rojo, Azul)</label>
                                <input type="text" name="colores" class="form-control" placeholder="Negro, Blanco, Rojo">
                            </div>
                        </div>

                        <div class="form-check mt-2">
                            <input type="checkbox" class="form-check-input" id="activoCrear" name="activo" checked>
                            <label class="form-check-label" for="activoCrear">Activo</label>
                        </div>
                        <div class="form-check mt-2">
                            <input type="checkbox" class="form-check-input" id="publicadoCrear" name="publicado">
                            <label class="form-check-label" for="publicadoCrear">Publicado</label>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <div class="form-group">
                            <label>Imágenes del producto</label>
                            <div class="d-flex align-items-center mb-2">
                                <button type="button" class="btn btn-outline-primary btn-sm" id="btnAgregarImagenesCrear">
                                    <i class="fas fa-plus-circle"></i> Agregar imagen
                                </button>
                                <small class="form-text text-muted ml-3">Agrega las imágenes una por una y podrás eliminar las que no quieras.</small>
                            </div>
                            <input type="file" id="crearImagen" name="imagenes" class="d-none" accept="image/*" multiple>
                        </div>

                        <div class="preview-box">
                            <div id="crearImagenesPreview" class="d-flex flex-wrap"></div>
                            <span id="crearImagenSinDato" class="text-muted">No hay imágenes seleccionadas.</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
            </form>
        </div>
    </div>
</div>
